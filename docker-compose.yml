services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vc_hrms_prod}
      POSTGRES_USER: ${POSTGRES_USER:-hrms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretSecurePassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms_admin} -d ${POSTGRES_DB:-vc_hrms_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms-net

  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-RedisSecure2026!}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecure2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hrms-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrms_admin}:${POSTGRES_PASSWORD:-SuperSecretSecurePassword2026!}@postgres:5432/${POSTGRES_DB:-vc_hrms_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSecure2026!}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-EnterpriseJwtAccessSecretKey2026Prod!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-EnterpriseJwtRefreshSecretKey2026Prod!}
      COOKIE_SECRET: ${COOKIE_SECRET:-EnterpriseCookieSecretKey2026Prod!}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-admin@example.com}
      VC_ORGANICS_OWNER_EMAIL: ${VC_ORGANICS_OWNER_EMAIL:-owner@vcorganics.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - hrms-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hrms-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-hrms.vcorganics.com}/api
    networks:
      - hrms-net

  nginx:
    image: nginx:alpine
    container_name: hrms-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    networks:
      - hrms-net

networks:
  hrms-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
